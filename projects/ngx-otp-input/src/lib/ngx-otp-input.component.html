<div
  class="ngx-otp-input-root"
  role="group"
  [attr.aria-label]="ariaLabel()"
  (pointerdown)="handleContainerPointerDown($event)"
  data-testid="ngx-otp-input-root"
>
  <input
    #otpInput
    class="ngx-otp-input-native"
    [type]="inputType()"
    [disabled]="isDisabled()"
    [readOnly]="readonly()"
    [inputMode]="inputMode()"
    [attr.pattern]="patternAttribute()"
    [attr.name]="name()"
    [attr.aria-required]="required() ? 'true' : null"
    autocomplete="one-time-code"
    autocapitalize="off"
    autocorrect="off"
    spellcheck="false"
    [attr.aria-invalid]="
      resolvedStatus() === 'error' || hasInvalidOtp() ? 'true' : null
    "
    [attr.aria-describedby]="statusMessage() ? statusMessageId : null"
    (beforeinput)="handleBeforeInput($event)"
    (input)="handleInput($event)"
    (keydown)="handleKeyDown($event)"
    (paste)="handlePaste($event)"
    (blur)="handleBlur()"
    data-testid="ngx-otp-input-native"
  />

  <div
    class="ngx-otp-input-form"
    aria-hidden="true"
  >
    @for (i of boxes(); track i) {
      <div
        class="ngx-otp-input-box"
        [class.ngx-otp-input-disabled]="isDisabled()"
        [class.ngx-otp-input-filled]="characters()[i]"
        [class.ngx-otp-input-success]="resolvedStatus() === 'success'"
        [class.ngx-otp-input-failed]="resolvedStatus() === 'error'"
        [class.ngx-otp-input-active]="i === activeIndex() && !isDisabled()"
        (pointerdown)="handleBoxPointerDown($event, i)"
        data-testid="ngx-otp-input-box"
      >
        {{ displayCharacters()[i] }}
      </div>
    }
  </div>

  <span
    [id]="statusMessageId"
    class="ngx-otp-input-status"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  >
    {{ statusMessage() }}
  </span>
</div>
